name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit merged by the protected PR workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APC_VALIDATE_HOST_UI: "0"
  APC_VALIDATE_REAL_AGENT_CONNECTORS: "0"
  APC_VALIDATE_REAL_APP_SERVER: "0"
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Classify change once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.validation_base.outputs.base }}
      docs_only: ${{ steps.validation_scope.outputs.docs_only }}
      localization: ${{ steps.validation_scope.outputs.localization }}
      scripts: ${{ steps.validation_scope.outputs.scripts }}
      producer: ${{ steps.validation_scope.outputs.producer }}
      connectors: ${{ steps.validation_scope.outputs.connectors }}
      schemas: ${{ steps.validation_scope.outputs.schemas }}
      plugin_version: ${{ steps.validation_scope.outputs.plugin_version }}
      rust_mode: ${{ steps.validation_scope.outputs.rust_mode }}
      swift_mode: ${{ steps.validation_scope.outputs.swift_mode }}
      bundle: ${{ steps.validation_scope.outputs.bundle }}
      computer_use: ${{ steps.validation_scope.outputs.computer_use }}
      lane: ${{ steps.development_context.outputs.lane }}
      full_candidate: ${{ steps.development_context.outputs.full_candidate }}
      release_source: ${{ steps.development_context.outputs.release_source }}
      release_preparation: ${{ steps.development_context.outputs.release_preparation }}
      actionable: ${{ steps.actionable.outputs.actionable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Route edited pull-request events
        id: actionable
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base.ref.from }}
        run: |
          actionable=1
          if [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "edited" && -z "$BASE_CHANGED" ]]; then
            actionable=0
            echo 'Title/body-only edit: complete CI and merge authorization are intentionally skipped.' >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "actionable=$actionable" >>"$GITHUB_OUTPUT"

      - name: Resolve validation base
        id: validation_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
              echo "dispatched main commit does not match expected_sha" >&2
              exit 1
            fi
            test "$GITHUB_REF" = "refs/heads/main"
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          else
            base="$PUSH_BASE"
          fi
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          git rev-parse --verify "$base^{commit}" >/dev/null
          echo "base=$base" >>"$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: validation_scope
        run: |
          ./script/validation_scope.py \
            --base-ref "${{ steps.validation_base.outputs.base }}" \
            --format github >>"$GITHUB_OUTPUT"

      - name: Resolve direct, train, and main validation lane
        id: development_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./script/development_flow.py ci-context \
              --event pull_request \
              --base "$PR_BASE_BRANCH" \
              --head "$PR_HEAD_BRANCH" \
              --draft "${PR_DRAFT:-false}" \
              --format github >>"$GITHUB_OUTPUT"
          else
            ./script/development_flow.py ci-context \
              --event push \
              --base main \
              --format github >>"$GITHUB_OUTPUT"
          fi

  promotion:
    name: Promote trusted PR proof to main
    needs: scope
    if: needs.scope.outputs.actionable == '1' && needs.scope.outputs.release_source == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      promoted: ${{ steps.finalize.outputs.promoted }}
      fallback_category: ${{ steps.prepare.outputs.fallback_category }}
      promotion_seconds: ${{ steps.prepare.outputs.promotion_seconds }}
      validation_commit: ${{ steps.finalize.outputs.validation_commit }}
      validation_run_id: ${{ steps.finalize.outputs.validation_run_id }}
      validation_run_attempt: ${{ steps.finalize.outputs.validation_run_attempt }}
      validation_ref: ${{ steps.finalize.outputs.validation_ref }}
      validation_proof_sha256: ${{ steps.finalize.outputs.validation_proof_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Attempt exact-tree PR proof promotion
        id: prepare
        env:
          MAIN_PARENT: ${{ needs.scope.outputs.base }}
        run: |
          started="$SECONDS"
          mkdir -p "$RUNNER_TEMP/promoted-interaction"
          promotion_ready=0
          for attempt in 1 2 3; do
            if ./script/ci_proof_promotion.py promote \
              --repository "$GITHUB_REPOSITORY" \
              --main-commit "$GITHUB_SHA" \
              --main-parent "$MAIN_PARENT" \
              --candidate-attestation "$RUNNER_TEMP/candidate-interaction-attestation.json" \
              --metadata "$RUNNER_TEMP/promotion-metadata.json" \
              --failure-metadata "$RUNNER_TEMP/promotion-failure.json"; then
              promotion_ready=1
              break
            fi
            if ((attempt < 3)); then
              sleep "$((attempt * 5))"
            fi
          done
          if [[ "$promotion_ready" == "1" ]]; then
            if ./script/validate_overlay_interaction.sh \
              --attestation-out "$RUNNER_TEMP/promoted-interaction/interaction-attestation.json" \
              --build-id "source.$GITHUB_SHA" \
              --proof-in "$RUNNER_TEMP/candidate-interaction-attestation.json"; then
              echo "candidate=1" >>"$GITHUB_OUTPUT"
            else
              echo "candidate=0" >>"$GITHUB_OUTPUT"
              echo "fallback_category=tree-mismatch" >>"$GITHUB_OUTPUT"
              echo 'Interaction proof rebinding failed; running complete main CI.' >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "candidate=0" >>"$GITHUB_OUTPUT"
            category="$(jq -er '.category' "$RUNNER_TEMP/promotion-failure.json" 2>/dev/null || echo unavailable)"
            echo "fallback_category=$category" >>"$GITHUB_OUTPUT"
            echo "No exact-tree trusted PR proof was promotable ($category); running complete main CI." >>"$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$promotion_ready" == "1" && "$(tail -n 1 "$GITHUB_OUTPUT")" != fallback_category=* ]]; then
            echo "fallback_category=none" >>"$GITHUB_OUTPUT"
          fi
          echo "promotion_seconds=$((SECONDS - started))" >>"$GITHUB_OUTPUT"

      - name: Upload main-bound promoted interaction proof
        if: steps.prepare.outputs.candidate == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promoted-interaction-attestation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/promoted-interaction/interaction-attestation.json

      - name: Publish promotion routing
        id: finalize
        if: steps.prepare.outputs.candidate == '1'
        run: |
          echo "promoted=1" >>"$GITHUB_OUTPUT"
          for key in validation_commit validation_run_id validation_run_attempt validation_ref candidate_proof_sha256; do
            value="$(jq -er --arg key "$key" '.[$key]' "$RUNNER_TEMP/promotion-metadata.json")"
            if [[ "$key" == "candidate_proof_sha256" ]]; then
              key="validation_proof_sha256"
            fi
            echo "$key=$value" >>"$GITHUB_OUTPUT"
          done
          {
            echo '### Proof promotion'
            echo
            echo '| field | value |'
            echo '|---|---|'
            echo '| promoted | 1 |'
            echo "| candidate PR | $(jq -er '.pull_request_number' "$RUNNER_TEMP/promotion-metadata.json") |"
            echo "| candidate run/attempt | $(jq -er '.validation_run_id' "$RUNNER_TEMP/promotion-metadata.json") / $(jq -er '.validation_run_attempt' "$RUNNER_TEMP/promotion-metadata.json") |"
            echo "| candidate proof digest | $(jq -er '.candidate_proof_sha256' "$RUNNER_TEMP/promotion-metadata.json") |"
            echo '| fallback category | none |'
            echo '| routing seconds | ${{ steps.prepare.outputs.promotion_seconds }} |'
          } >>"$GITHUB_STEP_SUMMARY"

  static:
    name: Static source contracts
    needs: [scope, promotion]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Diff and source syntax
        run: |
          git diff --check "${{ needs.scope.outputs.base }}" --
          ./script/validate_source_syntax.sh

      - name: Localization parity
        if: needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.localization == '1'
        run: ./script/validate_localizations.py

      - name: Static workflow and build-script contracts
        if: needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.scripts == '1'
        run: ./script/validate_build_scripts_safety.sh --skip-source-syntax --static-only

      - name: Enforce changelog lane policy
        run: |
          ./script/changelog_fragments.py policy \
            --base-ref "${{ needs.scope.outputs.base }}" \
            --release-preparation "${{ needs.scope.outputs.release_preparation }}"

      - name: Codex plugin and Skill version discipline for this change
        if: needs.scope.outputs.plugin_version == '1'
        run: ./script/validate_codex_plugin_version.py --base-ref "${{ needs.scope.outputs.base }}"

  portable_contracts:
    name: Portable source and integration contracts
    needs: [scope, promotion]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' ||
      needs.scope.outputs.docs_only != '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install common validation tooling
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Prepare pinned Python validation environment
        if: needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.producer == '1' || needs.scope.outputs.bundle == '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/apc-validation-python"
          "$RUNNER_TEMP/apc-validation-python/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --only-binary=:all: "Pillow==11.3.0"
          "$RUNNER_TEMP/apc-validation-python/bin/python" - <<'PY'
          from PIL import Image, features
          if Image.__version__ != "11.3.0" or not features.check("webp_anim"):
              raise SystemExit("pinned Pillow lacks the required animated WebP support")
          PY
          echo "$RUNNER_TEMP/apc-validation-python/bin" >>"$GITHUB_PATH"

      - name: Schema contracts
        if: needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.schemas == '1' || needs.scope.outputs.producer == '1'
        run: |
          ./script/validate_schema_fixtures.sh
          ./script/validate_petpack_spec_schemas.sh

      - name: Portable producer contracts
        if: needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.producer == '1'
        run: |
          ./script/validate_pet_skills.sh
          ./script/validate_portable_pet_maker.sh

      - name: Generated connector runtime
        if: needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.connectors == '1'
        run: ./script/validate_connectors_runtime.sh

      - name: Security boundaries
        if: >-
          needs.scope.outputs.full_candidate == '1' ||
          needs.scope.outputs.rust_mode != 'none' ||
          needs.scope.outputs.schemas == '1' ||
          needs.scope.outputs.producer == '1' ||
          needs.scope.outputs.connectors == '1'
        run: ./script/validate_security_boundaries.sh

  macos_contracts:
    name: macOS build and lifecycle contracts
    needs: [scope, promotion]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' ||
      needs.scope.outputs.scripts == '1' ||
      needs.scope.outputs.swift_mode != 'none')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Complete macOS build and workflow contracts
        run: ./script/validate_build_scripts_safety.sh --skip-source-syntax

      - name: App lifecycle contract
        run: ./script/validate_app_lifecycle_contract.sh

  cargo_source:
    name: Prime portable Cargo sources
    needs: [scope, promotion]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.rust_mode != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cache_hit: ${{ steps.cargo_source_cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore or write the one portable Cargo source cache
        id: cargo_source_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Record Cargo source cache routing
        run: echo 'Cargo source exact hit = `${{ steps.cargo_source_cache.outputs.cache-hit }}`.' >>"$GITHUB_STEP_SUMMARY"

  rust_lint:
    name: Rust formatting and linting
    needs: [scope, promotion, cargo_source]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.rust_mode != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cache_hit: ${{ steps.rust_lint_cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Rust toolchain
        run: rustup show

      - name: Restore exact Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore or write the one portable lint target cache
        id: rust_lint_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-host-clippy-${{ hashFiles('Cargo.lock') }}

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict Rust linting
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust_test_build:
    name: Link portable Rust test binaries once
    needs: [scope, promotion, cargo_source]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.rust_mode != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      cache_hit: ${{ steps.rust_test_cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore exact Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore or write the one portable test target cache
        id: rust_test_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-host-test-${{ hashFiles('Cargo.lock') }}

      - name: Link the complete portable test inventory once
        run: cargo test --workspace --no-run --locked

      - name: Record Rust test cache routing
        run: echo 'Portable test target exact hit = `${{ steps.rust_test_cache.outputs.cache-hit }}`.' >>"$GITHUB_STEP_SUMMARY"

  rust_tests:
    name: Rust tests (${{ matrix.shard }})
    needs: [scope, promotion, cargo_source, rust_test_build]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.rust_mode != 'none')
    strategy:
      fail-fast: false
      matrix:
        shard: [core, integration-a, integration-b, integration-c, integration-d]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Rust toolchain
        run: rustup show

      - name: Restore exact Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore the exact portable test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-host-test-${{ hashFiles('Cargo.lock') }}

      - name: Run inventory-checked Rust shard
        run: |
          ./script/validate_rust_test_shards.py \
            --shard "${{ matrix.shard }}" \
            --completion-dir "$RUNNER_TEMP/rust-shard-proof"

      - name: Upload exact Rust shard completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-rust-shard-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/rust-shard-proof/${{ matrix.shard }}.json

  rust_test_proof:
    name: Verify every Rust test shard
    needs: [scope, promotion, rust_tests]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.rust_mode != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download this attempt's Rust shard completions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-rust-shard-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/rust-shard-proof

      - name: Require the exact Rust shard completion set
        run: ./script/validate_rust_test_shards.py --verify-completion-dir "$RUNNER_TEMP/rust-shard-proof"

  macos_platform:
    name: macOS Rust platform semantics
    needs: [scope, promotion]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.rust_mode != 'none' || needs.scope.outputs.bundle == '1')
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      cache_hit: ${{ steps.macos_rust_cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore or write the one macOS Cargo source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore or write the one macOS platform target cache
        id: macos_rust_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-host-platform-test-${{ hashFiles('Cargo.lock') }}

      - name: Prove platform lint, library, process, CLI metadata, and daemon semantics
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p petcore --lib --locked
          cargo test -p petcore --test integration_c process_runner:: --locked
          cargo test -p petcore-cli --test integration petpack_build_metadata:: --locked
          cargo test -p petcore --test integration_d daemon_lifecycle:: --locked

      - name: Record macOS platform cache routing
        run: echo 'macOS platform target exact hit = `${{ steps.macos_rust_cache.outputs.cache-hit }}`.' >>"$GITHUB_STEP_SUMMARY"

  swift_interaction:
    name: Swift and interaction proof
    needs: [scope, promotion]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.bundle == '1' || needs.scope.outputs.swift_mode != 'none')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify App build toolchain
        run: ./script/validate_macos_build_contract.py toolchain

      - name: Run complete Swift suite and create source interaction proof
        env:
          APC_BUILD_ID: source.${{ github.sha }}
        run: |
          ./script/prepare_interaction_attestation.sh \
            --output "$RUNNER_TEMP/interaction-attestation.json" \
            --swift-scope all

      - name: Upload source interaction proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-interaction-attestation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/interaction-attestation.json

      - name: Package exact strict Swift debug products
        run: |
          ./script/swift_build_artifact.py create \
            --output-dir "$RUNNER_TEMP/swift-debug-products" \
            --commit "$GITHUB_SHA"

      - name: Upload exact strict Swift debug products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-swift-debug-products-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/swift-debug-products

  stress:
    name: Bounded event-storm stress
    needs: [scope, promotion, cargo_source, rust_test_build]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      needs.scope.outputs.full_candidate == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore exact Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore the exact portable test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-host-test-${{ hashFiles('Cargo.lock') }}

      - name: Run release-grade bounded event storm
        run: ./script/validate_event_storm.sh

  overlay:
    name: Offline overlay contracts
    needs: [scope, promotion, swift_interaction]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.bundle == '1' || needs.scope.outputs.swift_mode != 'none') &&
      needs.swift_interaction.result == 'success'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-interaction-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/interaction-proof

      - name: Download exact strict Swift debug products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-swift-debug-products-${{ github.sha }}
          path: ${{ runner.temp }}/swift-debug-products

      - name: Resolve sources and restore commit-bound Swift products
        run: |
          (cd apps/macos && swift package resolve --disable-sandbox)
          ./script/swift_build_artifact.py restore \
            --input-dir "$RUNNER_TEMP/swift-debug-products" \
            --commit "$GITHUB_SHA"

      - name: Run offline overlay geometry, scheduler, accessibility, frame, and pointer contracts
        run: |
          ./script/validate_overlay_offline.sh \
            --interaction-attestation "$RUNNER_TEMP/interaction-proof/interaction-attestation.json"

  bundle:
    name: Packaged development App proof
    needs: [scope, promotion, swift_interaction]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.actionable == '1' &&
      needs.promotion.outputs.promoted != '1' &&
      (needs.scope.outputs.full_candidate == '1' || needs.scope.outputs.bundle == '1')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-interaction-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/interaction-proof

      - name: Download exact strict Swift debug products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-swift-debug-products-${{ github.sha }}
          path: ${{ runner.temp }}/swift-debug-products

      - name: Resolve sources and restore commit-bound Swift products
        run: |
          (cd apps/macos && swift package resolve --disable-sandbox)
          ./script/swift_build_artifact.py restore \
            --input-dir "$RUNNER_TEMP/swift-debug-products" \
            --commit "$GITHUB_SHA"

      - name: Restore or write the one development-bundle Cargo source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore or write the exact development-bundle Rust target cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-host-development-bundle-${{ hashFiles('Cargo.lock') }}

      - name: Rebind source interaction proof to the development build identity
        id: development_identity
        run: |
          version="$(awk -F'"' '/^version = / {print $2; exit}' crates/petcore/Cargo.toml)"
          variant="debug|$(uname -m)|universal=0|signed=1"
          fingerprint="$(
            ./script/validation_fingerprint.py \
              --root "$GITHUB_WORKSPACE" \
              --scope runtime \
              --extra "$variant"
          )"
          build_id="$version.1.develop.${fingerprint:0:16}"
          APC_BUILD_ID="$build_id" \
            ./script/prepare_interaction_attestation.sh \
              --output "$RUNNER_TEMP/interaction-proof/development-attestation.json" \
              --proof-in "$RUNNER_TEMP/interaction-proof/interaction-attestation.json"
          echo "build_id=$build_id" >>"$GITHUB_OUTPUT"

      - name: Prepare pinned Python validation environment
        run: |
          python3 -m venv "$RUNNER_TEMP/apc-validation-python"
          "$RUNNER_TEMP/apc-validation-python/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --only-binary=:all: "Pillow==11.3.0"
          echo "$RUNNER_TEMP/apc-validation-python/bin" >>"$GITHUB_PATH"

      - name: Build and fully validate development App from the proven interaction contract
        env:
          APC_BUILD_ID: ${{ steps.development_identity.outputs.build_id }}
        run: |
          ./script/build_app_bundle.sh \
            --configuration debug \
            --interaction-attestation "$RUNNER_TEMP/interaction-proof/development-attestation.json" \
            --validation full

  candidate_proof:
    name: Create promotable PR source proof
    needs: [scope, promotion, static, portable_contracts, macos_contracts, cargo_source, rust_lint, rust_test_build, rust_tests, rust_test_proof, macos_platform, swift_interaction, stress, overlay, bundle]
    if: always() && github.event_name == 'pull_request' && needs.scope.outputs.actionable == '1' && needs.scope.outputs.full_candidate == '1'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Require every candidate source gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          PORTABLE_CONTRACTS_RESULT: ${{ needs.portable_contracts.result }}
          MACOS_CONTRACTS_RESULT: ${{ needs.macos_contracts.result }}
          CARGO_SOURCE_RESULT: ${{ needs.cargo_source.result }}
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          RUST_TEST_BUILD_RESULT: ${{ needs.rust_test_build.result }}
          RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          RUST_TEST_PROOF_RESULT: ${{ needs.rust_test_proof.result }}
          MACOS_PLATFORM_RESULT: ${{ needs.macos_platform.result }}
          SWIFT_RESULT: ${{ needs.swift_interaction.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
          OVERLAY_RESULT: ${{ needs.overlay.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
        run: |
          for result in "$STATIC_RESULT" "$PORTABLE_CONTRACTS_RESULT" "$MACOS_CONTRACTS_RESULT" "$CARGO_SOURCE_RESULT" "$RUST_LINT_RESULT" "$RUST_TEST_BUILD_RESULT" "$RUST_TESTS_RESULT" "$RUST_TEST_PROOF_RESULT" "$MACOS_PLATFORM_RESULT" "$SWIFT_RESULT" "$STRESS_RESULT" "$OVERLAY_RESULT" "$BUNDLE_RESULT"; do
            case "$result" in
              success) ;;
              *) echo "candidate source dependency did not succeed: $result" >&2; exit 1 ;;
            esac
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-interaction-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-source

      - name: Verify and record candidate toolchains
        run: ./script/validate_macos_build_contract.py toolchain

      - name: Bind complete PR gates to the tested merge tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-proof"
          mv "$RUNNER_TEMP/candidate-source/interaction-attestation.json" \
            "$RUNNER_TEMP/candidate-proof/interaction-attestation.json"
          ./script/ci_proof_promotion.py create-candidate \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --base-commit "$PR_BASE_COMMIT" \
            --head-commit "$PR_HEAD_COMMIT" \
            --tested-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attestation "$RUNNER_TEMP/candidate-proof/interaction-attestation.json" \
            --output "$RUNNER_TEMP/candidate-proof/candidate-proof.json"

      - name: Upload promotable PR source proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-candidate-proof-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/candidate-proof

  source_proof:
    name: Bind release source proof to main commit
    needs: [scope, promotion, static, portable_contracts, macos_contracts, cargo_source, rust_lint, rust_test_build, rust_tests, rust_test_proof, macos_platform, swift_interaction, stress, overlay, bundle, candidate_proof]
    if: always() && needs.scope.outputs.release_source == '1'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require every release source gate
        env:
          PROMOTED: ${{ needs.promotion.outputs.promoted }}
          STATIC_RESULT: ${{ needs.static.result }}
          PORTABLE_CONTRACTS_RESULT: ${{ needs.portable_contracts.result }}
          MACOS_CONTRACTS_RESULT: ${{ needs.macos_contracts.result }}
          CARGO_SOURCE_RESULT: ${{ needs.cargo_source.result }}
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          RUST_TEST_BUILD_RESULT: ${{ needs.rust_test_build.result }}
          RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          RUST_TEST_PROOF_RESULT: ${{ needs.rust_test_proof.result }}
          MACOS_PLATFORM_RESULT: ${{ needs.macos_platform.result }}
          SWIFT_RESULT: ${{ needs.swift_interaction.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
          OVERLAY_RESULT: ${{ needs.overlay.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
        run: |
          if [[ "$PROMOTED" == "1" ]]; then
            for result in "$STATIC_RESULT" "$PORTABLE_CONTRACTS_RESULT" "$MACOS_CONTRACTS_RESULT" "$CARGO_SOURCE_RESULT" "$RUST_LINT_RESULT" "$RUST_TEST_BUILD_RESULT" "$RUST_TESTS_RESULT" "$RUST_TEST_PROOF_RESULT" "$MACOS_PLATFORM_RESULT" "$SWIFT_RESULT" "$STRESS_RESULT" "$OVERLAY_RESULT" "$BUNDLE_RESULT"; do
              case "$result" in
                skipped) ;;
                *) echo "promoted main CI unexpectedly scheduled a complete gate: $result" >&2; exit 1 ;;
              esac
            done
          else
            for result in "$STATIC_RESULT" "$PORTABLE_CONTRACTS_RESULT" "$MACOS_CONTRACTS_RESULT" "$CARGO_SOURCE_RESULT" "$RUST_LINT_RESULT" "$RUST_TEST_BUILD_RESULT" "$RUST_TESTS_RESULT" "$RUST_TEST_PROOF_RESULT" "$MACOS_PLATFORM_RESULT" "$SWIFT_RESULT" "$STRESS_RESULT" "$OVERLAY_RESULT" "$BUNDLE_RESULT"; do
              case "$result" in
                success) ;;
                *) echo "release source dependency did not succeed: $result" >&2; exit 1 ;;
              esac
            done
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.promotion.outputs.promoted == '1' && format('promoted-interaction-attestation-{0}', github.sha) || format('ci-interaction-attestation-{0}', github.sha) }}
          path: ${{ runner.temp }}/interaction-proof

      - name: Verify and record proof-host toolchains
        run: ./script/validate_macos_build_contract.py toolchain

      - name: Resolve latest stable release baseline
        id: release_baseline
        run: |
          previous_tag="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/latest" \
              --jq '.tag_name'
          )"
          [[ "$previous_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "previous_tag=$previous_tag" >>"$GITHUB_OUTPUT"

      - name: Recheck Codex plugin and bundled Skill version discipline
        run: ./script/validate_codex_plugin_version.py --base-ref "${{ steps.release_baseline.outputs.previous_tag }}"

      - name: Resolve validation provenance
        id: validation_provenance
        env:
          PROMOTED: ${{ needs.promotion.outputs.promoted }}
          PROMOTED_COMMIT: ${{ needs.promotion.outputs.validation_commit }}
          PROMOTED_RUN_ID: ${{ needs.promotion.outputs.validation_run_id }}
          PROMOTED_RUN_ATTEMPT: ${{ needs.promotion.outputs.validation_run_attempt }}
          PROMOTED_REF: ${{ needs.promotion.outputs.validation_ref }}
          PROMOTED_PROOF_SHA256: ${{ needs.promotion.outputs.validation_proof_sha256 }}
        run: |
          if [[ "$PROMOTED" == "1" ]]; then
            {
              echo "validation_mode=promoted"
              echo "validation_commit=$PROMOTED_COMMIT"
              echo "validation_run_id=$PROMOTED_RUN_ID"
              echo "validation_run_attempt=$PROMOTED_RUN_ATTEMPT"
              echo "validation_ref=$PROMOTED_REF"
              echo "validation_proof_sha256=$PROMOTED_PROOF_SHA256"
            } >>"$GITHUB_OUTPUT"
          else
            {
              echo "validation_mode=full"
              echo "validation_commit=$GITHUB_SHA"
              echo "validation_run_id=$GITHUB_RUN_ID"
              echo "validation_run_attempt=$GITHUB_RUN_ATTEMPT"
              echo "validation_ref=refs/heads/main"
            } >>"$GITHUB_OUTPUT"
          fi

      - name: Create exact-commit source proof
        run: |
          mkdir -p "$RUNNER_TEMP/release-source-proof"
          cp "$RUNNER_TEMP/interaction-proof/interaction-attestation.json" \
            "$RUNNER_TEMP/release-source-proof/interaction-attestation.json"
          ./script/release_source_proof.py create \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --previous-release-tag "${{ steps.release_baseline.outputs.previous_tag }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-event "$GITHUB_EVENT_NAME" \
            --validation-mode "${{ steps.validation_provenance.outputs.validation_mode }}" \
            --validation-commit "${{ steps.validation_provenance.outputs.validation_commit }}" \
            --validation-run-id "${{ steps.validation_provenance.outputs.validation_run_id }}" \
            --validation-run-attempt "${{ steps.validation_provenance.outputs.validation_run_attempt }}" \
            --validation-ref "${{ steps.validation_provenance.outputs.validation_ref }}" \
            --validation-proof-sha256 "${{ steps.validation_provenance.outputs.validation_proof_sha256 }}" \
            --attestation "$RUNNER_TEMP/release-source-proof/interaction-attestation.json" \
            --output "$RUNNER_TEMP/release-source-proof/source-proof.json"

      - name: Upload exact-commit release source proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source-proof-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/release-source-proof

  required:
    name: Required CI
    needs: [scope, promotion, static, portable_contracts, macos_contracts, cargo_source, rust_lint, rust_test_build, rust_tests, rust_test_proof, macos_platform, swift_interaction, stress, overlay, bundle, candidate_proof, source_proof]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every scheduled job
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          PORTABLE_CONTRACTS_RESULT: ${{ needs.portable_contracts.result }}
          MACOS_CONTRACTS_RESULT: ${{ needs.macos_contracts.result }}
          CARGO_SOURCE_RESULT: ${{ needs.cargo_source.result }}
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          RUST_TEST_BUILD_RESULT: ${{ needs.rust_test_build.result }}
          RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          RUST_TEST_PROOF_RESULT: ${{ needs.rust_test_proof.result }}
          MACOS_PLATFORM_RESULT: ${{ needs.macos_platform.result }}
          SWIFT_RESULT: ${{ needs.swift_interaction.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
          OVERLAY_RESULT: ${{ needs.overlay.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          CANDIDATE_PROOF_RESULT: ${{ needs.candidate_proof.result }}
          SOURCE_PROOF_RESULT: ${{ needs.source_proof.result }}
          FULL_CANDIDATE: ${{ needs.scope.outputs.full_candidate }}
          RELEASE_SOURCE: ${{ needs.scope.outputs.release_source }}
          PROMOTED: ${{ needs.promotion.outputs.promoted }}
          ACTIONABLE: ${{ needs.scope.outputs.actionable }}
        run: |
          for result in \
            "$SCOPE_RESULT" "$STATIC_RESULT" "$PORTABLE_CONTRACTS_RESULT" "$MACOS_CONTRACTS_RESULT" \
            "$CARGO_SOURCE_RESULT" "$RUST_LINT_RESULT" "$RUST_TEST_BUILD_RESULT" "$RUST_TESTS_RESULT" "$RUST_TEST_PROOF_RESULT" "$MACOS_PLATFORM_RESULT" "$SWIFT_RESULT" \
            "$STRESS_RESULT" "$OVERLAY_RESULT" "$BUNDLE_RESULT" \
            "$CANDIDATE_PROOF_RESULT" "$SOURCE_PROOF_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "scheduled CI job did not succeed: $result" >&2; exit 1 ;;
            esac
          done
          if [[ "$ACTIONABLE" == "1" && "$FULL_CANDIDATE" == "1" && "$PROMOTED" != "1" ]]; then
            for result in \
              "$STATIC_RESULT" "$PORTABLE_CONTRACTS_RESULT" "$MACOS_CONTRACTS_RESULT" "$CARGO_SOURCE_RESULT" "$RUST_LINT_RESULT" \
              "$RUST_TEST_BUILD_RESULT" "$RUST_TESTS_RESULT" "$RUST_TEST_PROOF_RESULT" "$MACOS_PLATFORM_RESULT" "$SWIFT_RESULT" "$STRESS_RESULT" \
              "$OVERLAY_RESULT" "$BUNDLE_RESULT"; do
              case "$result" in
                success) ;;
                *) echo "complete main-bound job did not succeed: $result" >&2; exit 1 ;;
              esac
            done
          fi
          if [[ "$ACTIONABLE" == "1" && "$FULL_CANDIDATE" == "1" && "$RELEASE_SOURCE" != "1" ]]; then
            test "$CANDIDATE_PROOF_RESULT" = "success"
          fi
          if [[ "$PROMOTED" == "1" ]]; then
            test "$RELEASE_SOURCE" = "1"
            for result in \
              "$STATIC_RESULT" "$PORTABLE_CONTRACTS_RESULT" "$MACOS_CONTRACTS_RESULT" "$CARGO_SOURCE_RESULT" "$RUST_LINT_RESULT" \
              "$RUST_TEST_BUILD_RESULT" "$RUST_TESTS_RESULT" "$RUST_TEST_PROOF_RESULT" "$MACOS_PLATFORM_RESULT" "$SWIFT_RESULT" "$STRESS_RESULT" \
              "$OVERLAY_RESULT" "$BUNDLE_RESULT" "$CANDIDATE_PROOF_RESULT"; do
              test "$result" = "skipped"
            done
          fi
          if [[ "$RELEASE_SOURCE" == "1" ]]; then
            test "$SOURCE_PROOF_RESULT" = "success"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Emit content-free engineering feedback metrics
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED: ${{ needs.promotion.outputs.promoted }}
          FALLBACK_CATEGORY: ${{ needs.promotion.outputs.fallback_category }}
          CARGO_SOURCE_CACHE_HIT: ${{ needs.cargo_source.outputs.cache_hit }}
          RUST_LINT_CACHE_HIT: ${{ needs.rust_lint.outputs.cache_hit }}
          RUST_TEST_CACHE_HIT: ${{ needs.rust_test_build.outputs.cache_hit }}
          MACOS_PLATFORM_CACHE_HIT: ${{ needs.macos_platform.outputs.cache_hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/engineering-metrics"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '{created_at: .created_at}' >"$RUNNER_TEMP/engineering-metrics/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            >"$RUNNER_TEMP/engineering-metrics/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            >"$RUNNER_TEMP/engineering-metrics/caches.json"
          run_created_at="$(jq -r '.created_at' "$RUNNER_TEMP/engineering-metrics/run.json")"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          proof_outcome=not-applicable
          if [[ "$PROMOTED" == "1" ]]; then
            proof_outcome=promoted
          elif [[ "${{ needs.scope.outputs.full_candidate }}" == "1" ]]; then
            proof_outcome=full-validation
          fi
          cache_value() {
            case "$1" in
              true|false) printf '%s' "$1" ;;
              '') printf 'skipped' ;;
              *) printf 'unavailable' ;;
            esac
          }
          ./script/engineering_metrics.py \
            --base-ref "${{ needs.scope.outputs.base }}" \
            --jobs-json "$RUNNER_TEMP/engineering-metrics/jobs.json" \
            --cache-json "$RUNNER_TEMP/engineering-metrics/caches.json" \
            --run-created-at "$run_created_at" \
            --observed-at "$observed_at" \
            --proof-outcome "$proof_outcome" \
            --fallback-category "${FALLBACK_CATEGORY:-not-applicable}" \
            --cache-observation "cargo-source=$(cache_value "$CARGO_SOURCE_CACHE_HIT")" \
            --cache-observation "rust-lint=$(cache_value "$RUST_LINT_CACHE_HIT")" \
            --cache-observation "rust-test=$(cache_value "$RUST_TEST_CACHE_HIT")" \
            --cache-observation "macos-platform=$(cache_value "$MACOS_PLATFORM_CACHE_HIT")" \
            --output "$RUNNER_TEMP/engineering-metrics/metrics.json" \
            --summary "$RUNNER_TEMP/engineering-metrics/summary.md" >>"$GITHUB_STEP_SUMMARY"
          rm "$RUNNER_TEMP/engineering-metrics/run.json" \
            "$RUNNER_TEMP/engineering-metrics/jobs.json" \
            "$RUNNER_TEMP/engineering-metrics/caches.json"

      - name: Upload bounded engineering feedback metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engineering-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/engineering-metrics

      - name: Record live UI validation routing
        env:
          DEVELOPMENT_LANE: ${{ needs.scope.outputs.lane }}
          PROMOTED: ${{ needs.promotion.outputs.promoted }}
          FALLBACK_CATEGORY: ${{ needs.promotion.outputs.fallback_category }}
          ACTIONABLE: ${{ needs.scope.outputs.actionable }}
        run: |
          printf 'Development lane: %s.\n' "$DEVELOPMENT_LANE" >>"$GITHUB_STEP_SUMMARY"
          if [[ "$PROMOTED" == "1" ]]; then
            echo 'This main commit reused the exact-tree PR candidate proof from the complete direct/train gate; only main-bound proof issuance ran after merge.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$ACTIONABLE" != "1" ]]; then
            echo 'This title/body-only edit intentionally issued no merge ticket and scheduled no complete gates.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "${{ needs.scope.outputs.full_candidate }}" == "1" ]]; then
            echo "This is a complete main-bound candidate gate; promotion fallback category: ${FALLBACK_CATEGORY:-not-applicable}." >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'This is a change-scoped task-to-train or draft gate.' >>"$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ needs.scope.outputs.computer_use }}" == "recommended" ]]; then
            echo 'UI source changed: Computer Use is recommended for a human-owned acceptance session, but is never auto-run in CI.' >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'No live UI or Computer Use validation is required for this change scope.' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Reject tracked build output and caches
        run: |
          tracked_generated="$(
            git ls-files \
              | grep -E '(^|/)(__pycache__/|[^/]+\.py[co]$|DerivedData/|target/|\.build/|[^/]+\.petpack$|generation-jobs/)' \
              | grep -Ev '^apps/macos/Sources/AgentPetCompanion/Resources/BuiltInPets/(pet_bytebudcodex|pet_pinklace|pet_xingwutuanzi)\.petpack$' \
              || true
          )"
          if [[ -n "$tracked_generated" ]]; then
            printf '%s\n' "$tracked_generated"
            echo 'Tracked generated output or cache detected' >&2
            exit 1
          fi

      - name: Verify clean generated state
        run: git diff --check

      - name: Bind the successful PR run to its exact merge lane
        if: github.event_name == 'pull_request' && needs.scope.outputs.actionable == '1'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          DEVELOPMENT_LANE: ${{ needs.scope.outputs.lane }}
          FULL_CANDIDATE: ${{ needs.scope.outputs.full_candidate }}
        run: |
          mkdir -p "$RUNNER_TEMP/merge-ticket"
          ./script/ci_proof_promotion.py create-merge-ticket \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --base-ref "$PR_BASE_REF" \
            --base-commit "$PR_BASE_COMMIT" \
            --head-ref "$PR_HEAD_REF" \
            --head-commit "$PR_HEAD_COMMIT" \
            --tested-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --lane "$DEVELOPMENT_LANE" \
            --full-candidate "$FULL_CANDIDATE" \
            --output "$RUNNER_TEMP/merge-ticket/merge-ticket.json"

      - name: Upload exact PR merge ticket
        if: github.event_name == 'pull_request' && needs.scope.outputs.actionable == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-merge-ticket-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/merge-ticket/merge-ticket.json
